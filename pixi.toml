[workspace]
channels = ["conda-forge", "bioconda"]
name = "4-select"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/select.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/select.yml"

[dependencies]
r-base = ">=4.5"
bioconductor-scry = "*"
bioconductor-singlecellexperiment = "*"
bioconductor-anndatar = "*"
bioconductor-hdf5array = "*"
r-argparser = "*"
